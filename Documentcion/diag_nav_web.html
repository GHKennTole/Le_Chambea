<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: white; font-family: 'Times New Roman', serif; }
  .diagram { padding: 30px; width: 900px; }
  .title { font-size: 13px; font-weight: bold; font-style: italic; margin-bottom: 4px; }
  .subtitle { font-size: 11px; font-style: italic; margin-bottom: 20px; }

  /* ===== TREE DIAGRAM STYLES ===== */
  .tree { display: flex; flex-direction: column; align-items: center; }
  .node {
    border: 1.5px solid #555;
    background: #f0f0f0;
    padding: 5px 12px;
    font-size: 11px;
    text-align: center;
    min-width: 90px;
    max-width: 130px;
    position: relative;
  }
  .connector-down {
    width: 1.5px; background: #555; height: 20px; margin: 0 auto;
  }
  .row { display: flex; justify-content: center; gap: 0; position: relative; }
  .branch-wrapper {
    display: flex; flex-direction: column; align-items: center;
  }
  .horizontal-line {
    height: 1.5px; background: #555; position: absolute; top: 0;
  }

  /* Branch containers */
  .split-container { display: flex; align-items: flex-start; gap: 60px; margin-top: 20px; }
  .branch { display: flex; flex-direction: column; align-items: center; }
  .branch-line { width: 1.5px; background: #555; height: 20px; }

  /* Sub-levels */
  .sub-row { display: flex; gap: 10px; margin-top: 0; }
  .sub-branch { display: flex; flex-direction: column; align-items: center; }

  /* Connecting lines using SVG */
  .rel-container { position: relative; }
  svg.connectors { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }

  /* Note */
  .nota { font-size: 10px; font-style: italic; margin-top: 16px; }
  .nota span { font-weight: bold; }
</style>
</head>
<body>

<!-- ============================================================
     DIAGRAMA 1: NAVEGACIÓN WEB
     ============================================================ -->
<div class="diagram" id="diag1" style="width:860px;">
  <div class="title">Figura 20</div>
  <div class="subtitle">Diagrama de diseño de aplicación web</div>

  <svg width="820" height="680" style="display:block; margin:0 auto;">
    <defs>
      <marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#444"/>
      </marker>
    </defs>

    <!-- ─── Styles for boxes ─── -->
    <style>
      .box { fill: #f0f0f0; stroke: #444; stroke-width: 1.5; }
      .lbl { font-family: 'Times New Roman', serif; font-size: 11px; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .lbl-sm { font-family: 'Times New Roman', serif; font-size: 10px; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .line { stroke: #444; stroke-width: 1.5; fill: none; }
    </style>

    <!-- ROOT: Le Chambea -->
    <rect x="330" y="10" width="140" height="30" class="box"/>
    <text x="400" y="25" class="lbl">Le Chambea (Web)</text>

    <!-- down to Inicio sesion -->
    <line x1="400" y1="40" x2="400" y2="65" class="line"/>

    <!-- Inicio de sesión -->
    <rect x="330" y="65" width="140" height="30" class="box"/>
    <text x="400" y="80" class="lbl">Inicio de sesión</text>

    <!-- Fork left (Administrador) and right (Cliente/Prof) -->
    <line x1="400" y1="95" x2="400" y2="110" class="line"/>
    <line x1="160" y1="110" x2="640" y2="110" class="line"/>
    <line x1="160" y1="110" x2="160" y2="130" class="line"/>
    <line x1="640" y1="110" x2="640" y2="130" class="line"/>

    <!-- === LEFT: Administrador === -->
    <rect x="90" y="130" width="140" height="30" class="box"/>
    <text x="160" y="145" class="lbl">Administrador</text>

    <!-- Admin → Panel Admin -->
    <line x1="160" y1="160" x2="160" y2="185" class="line"/>
    <rect x="85" y="185" width="150" height="30" class="box"/>
    <text x="160" y="200" class="lbl">Panel de Administración</text>

    <!-- Panel → fork: Gestionar Usuarios | Gestionar Reportes -->
    <line x1="160" y1="215" x2="160" y2="230" class="line"/>
    <line x1="85" y1="230" x2="235" y2="230" class="line"/>
    <line x1="85" y1="230" x2="85" y2="248" class="line"/>
    <line x1="235" y1="230" x2="235" y2="248" class="line"/>

    <rect x="20" y="248" width="130" height="30" class="box"/>
    <text x="85" y="263" class="lbl">Gestionar Usuarios</text>
    <rect x="170" y="248" width="130" height="30" class="box"/>
    <text x="235" y="263" class="lbl">Gestionar Reportes</text>

    <!-- Gestionar Usuarios → Ver | Activar/Desactivar -->
    <line x1="85" y1="278" x2="85" y2="293" class="line"/>
    <line x1="30" y1="293" x2="140" y2="293" class="line"/>
    <line x1="30" y1="293" x2="30" y2="311" class="line"/>
    <line x1="140" y1="293" x2="140" y2="311" class="line"/>

    <rect x="0" y="311" width="60" height="28" class="box"/>
    <text x="30" y="325" class="lbl-sm">Ver perfil</text>
    <rect x="80" y="311" width="120" height="28" class="box"/>
    <text x="140" y="325" class="lbl-sm">Activar / Desactivar</text>

    <!-- Gestionar Reportes → Revisar | Resolver -->
    <line x1="235" y1="278" x2="235" y2="293" class="line"/>
    <line x1="185" y1="293" x2="285" y2="293" class="line"/>
    <line x1="185" y1="293" x2="185" y2="311" class="line"/>
    <line x1="285" y1="293" x2="285" y2="311" class="line"/>

    <rect x="150" y="311" width="70" height="28" class="box"/>
    <text x="185" y="325" class="lbl-sm">Revisar</text>
    <rect x="250" y="311" width="70" height="28" class="box"/>
    <text x="285" y="325" class="lbl-sm">Resolver</text>

    <!-- === RIGHT: Cliente / Profesional === -->
    <rect x="570" y="130" width="140" height="30" class="box"/>
    <text x="640" y="145" class="lbl">Cliente / Profesional</text>

    <!-- Chain going down -->
    <!-- Home -->
    <line x1="640" y1="160" x2="640" y2="185" class="line"/>
    <rect x="575" y="185" width="130" height="30" class="box"/>
    <text x="640" y="200" class="lbl">Home</text>

    <!-- Home → Perfil de Profesional -->
    <line x1="640" y1="215" x2="640" y2="238" class="line"/>
    <rect x="568" y="238" width="144" height="30" class="box"/>
    <text x="640" y="253" class="lbl">Perfil de Profesional</text>

    <!-- Perfil side: Agregar a Favoritos -->
    <line x1="712" y1="253" x2="760" y2="253" class="line"/>
    <rect x="760" y="238" width="120" height="30" class="box"/>
    <text x="820" y="253" class="lbl-sm">Agregar a Favoritos</text>

    <!-- Perfil → Contactar -->
    <line x1="640" y1="268" x2="640" y2="291" class="line"/>
    <rect x="583" y="291" width="114" height="30" class="box"/>
    <text x="640" y="306" class="lbl">Contactar</text>

    <!-- Contactar → Bandeja de entrada -->
    <line x1="640" y1="321" x2="640" y2="344" class="line"/>
    <rect x="568" y="344" width="144" height="30" class="box"/>
    <text x="640" y="359" class="lbl">Bandeja de entrada</text>

    <!-- Bandeja → Sala de chat -->
    <line x1="640" y1="374" x2="640" y2="397" class="line"/>
    <rect x="583" y="397" width="114" height="30" class="box"/>
    <text x="640" y="412" class="lbl">Sala de chat</text>

    <!-- Sala side branches -->
    <line x1="712" y1="412" x2="755" y2="412" class="line"/>
    <line x1="755" y1="380" x2="755" y2="450" class="line"/>
    <line x1="755" y1="380" x2="790" y2="380" class="line"/>
    <line x1="755" y1="412" x2="790" y2="412" class="line"/>
    <line x1="755" y1="450" x2="790" y2="450" class="line"/>

    <rect x="790" y="366" width="100" height="28" class="box"/>
    <text x="840" y="380" class="lbl-sm">Aceptar trabajo</text>
    <rect x="790" y="398" width="100" height="28" class="box"/>
    <text x="840" y="412" class="lbl-sm">Rechazar trabajo</text>
    <rect x="790" y="436" width="100" height="28" class="box"/>
    <text x="840" y="450" class="lbl-sm">Dejar reseña</text>

    <!-- Sala → Sula AI -->
    <line x1="640" y1="427" x2="640" y2="450" class="line"/>
    <rect x="592" y="450" width="96" height="30" class="box"/>
    <text x="640" y="465" class="lbl">Sula AI</text>

    <!-- Sula → Favoritos -->
    <line x1="640" y1="480" x2="640" y2="503" class="line"/>
    <rect x="592" y="503" width="96" height="30" class="box"/>
    <text x="640" y="518" class="lbl">Favoritos</text>

    <!-- Favoritos → Perfil de usuario -->
    <line x1="640" y1="533" x2="640" y2="556" class="line"/>
    <rect x="575" y="556" width="130" height="30" class="box"/>
    <text x="640" y="571" class="lbl">Perfil de usuario</text>

    <!-- Perfil → Settings -->
    <line x1="640" y1="586" x2="640" y2="609" class="line"/>
    <rect x="592" y="609" width="96" height="30" class="box"/>
    <text x="640" y="624" class="lbl">Settings</text>

    <!-- NOTA -->
    <text x="10" y="665" font-family="Times New Roman" font-size="11" font-style="italic" fill="#333">
      <tspan font-weight="bold">Nota.</tspan>
      <tspan> Fuente propia elaborado en Lucidchart</tspan>
    </text>
  </svg>
</div>

</body>
</html>
