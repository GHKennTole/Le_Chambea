<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: white; font-family: 'Times New Roman', serif; }
</style>
</head>
<body>

<!-- ============================================================
     DIAGRAMA NIVEL 0 – Vista macro del sistema
     ============================================================ -->
<div id="diag0" style="padding:30px; width:860px;">
  <div style="font-size:13px; font-weight:bold; font-style:italic; margin-bottom:4px;">Figura 21</div>
  <div style="font-size:11px; font-style:italic; margin-bottom:20px;">Diagrama de nivel 0</div>

  <svg width="800" height="340" style="display:block;">
    <style>
      .box { fill:#f0f0f0; stroke:#444; stroke-width:1.5; }
      .hdr { fill:#2c4070; stroke:#444; stroke-width:1.5; }
      .lbl { font-family:'Times New Roman',serif; font-size:11.5px; fill:#111; text-anchor:middle; dominant-baseline:middle; }
      .lbl-w { font-family:'Times New Roman',serif; font-size:11.5px; fill:white; text-anchor:middle; dominant-baseline:middle; font-weight:bold; }
      .lbl-sm { font-family:'Times New Roman',serif; font-size:10.5px; fill:#111; text-anchor:middle; dominant-baseline:middle; }
      .line { stroke:#444; stroke-width:1.5; fill:none; marker-end:url(#arr2); }
      .line2 { stroke:#444; stroke-width:1.5; fill:none; }
      .dash { stroke:#888; stroke-width:1; stroke-dasharray:5,3; fill:none; }
    </style>
    <defs>
      <marker id="arr2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
        <path d="M0,1 L7,4 L0,7 Z" fill="#444"/>
      </marker>
      <marker id="arr2b" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
        <path d="M0,1 L7,4 L0,7 Z" fill="#444"/>
      </marker>
    </defs>

    <!-- ── BLOCK 1: Aplicación Móvil ── -->
    <rect x="10" y="50" width="220" height="230" class="box" rx="2"/>
    <rect x="10" y="50" width="220" height="34" class="hdr" rx="2"/>
    <text x="120" y="67" class="lbl-w">Aplicación Móvil</text>
    <text x="120" y="100" class="lbl" font-style="italic">React Native + Expo</text>
    <line x1="10" y1="115" x2="230" y2="115" stroke="#bbb" stroke-width="0.8"/>
    <!-- sub items -->
    <text x="120" y="140" class="lbl-sm">📱 Screens (Vistas)</text>
    <text x="120" y="162" class="lbl-sm">🧩 Components (UI)</text>
    <text x="120" y="184" class="lbl-sm">⚙️ Containers (Lógica)</text>
    <text x="120" y="206" class="lbl-sm">🔀 React Navigation</text>
    <text x="120" y="228" class="lbl-sm">📦 Expo SDK</text>
    <!-- label bottom -->
    <text x="120" y="258" font-family="Times New Roman" font-size="10" fill="#555" text-anchor="middle">Android / iOS</text>

    <!-- ── BLOCK 2: Supabase (center) ── -->
    <rect x="290" y="50" width="220" height="230" class="box" rx="2"/>
    <rect x="290" y="50" width="220" height="34" class="hdr" rx="2"/>
    <text x="400" y="67" class="lbl-w">Supabase</text>
    <text x="400" y="100" class="lbl" font-style="italic">Backend as a Service</text>
    <line x1="290" y1="115" x2="510" y2="115" stroke="#bbb" stroke-width="0.8"/>
    <text x="400" y="140" class="lbl-sm">🗄️ PostgreSQL Database</text>
    <text x="400" y="162" class="lbl-sm">🔐 Supabase Auth</text>
    <text x="400" y="184" class="lbl-sm">📁 Supabase Storage</text>
    <text x="400" y="206" class="lbl-sm">⚡ Realtime (WebSocket)</text>
    <text x="400" y="228" class="lbl-sm">🌐 API RESTful</text>
    <text x="400" y="258" font-family="Times New Roman" font-size="10" fill="#555" text-anchor="middle">Open Source BaaS</text>

    <!-- ── BLOCK 3: Aplicación Web ── -->
    <rect x="570" y="50" width="220" height="230" class="box" rx="2"/>
    <rect x="570" y="50" width="220" height="34" class="hdr" rx="2"/>
    <text x="680" y="67" class="lbl-w">Aplicación Web</text>
    <text x="680" y="100" class="lbl" font-style="italic">React Native Web</text>
    <line x1="570" y1="115" x2="790" y2="115" stroke="#bbb" stroke-width="0.8"/>
    <text x="680" y="140" class="lbl-sm">🖥️ Screens Web</text>
    <text x="680" y="162" class="lbl-sm">🧩 Components (UI)</text>
    <text x="680" y="184" class="lbl-sm">👤 Admin Panel</text>
    <text x="680" y="206" class="lbl-sm">📋 Listings Profesionales</text>
    <text x="680" y="228" class="lbl-sm">💬 Chat Web</text>
    <text x="680" y="258" font-family="Times New Roman" font-size="10" fill="#555" text-anchor="middle">Navegador Web</text>

    <!-- ── Arrows between blocks ── -->
    <!-- App Móvil → Supabase (right) -->
    <line x1="230" y1="155" x2="282" y2="155" stroke="#444" stroke-width="1.8" marker-end="url(#arr2)"/>
    <!-- Supabase → App Móvil (left) -->
    <line x1="290" y1="175" x2="238" y2="175" stroke="#444" stroke-width="1.8" marker-end="url(#arr2)"/>
    <!-- label -->
    <rect x="228" y="145" width="65" height="42" fill="white" stroke="none"/>
    <text x="260" y="161" font-family="Times New Roman" font-size="9" fill="#333" text-anchor="middle">SDK</text>
    <text x="260" y="173" font-family="Times New Roman" font-size="9" fill="#333" text-anchor="middle">Supabase</text>
    <!-- App Web → Supabase (left) -->
    <line x1="570" y1="155" x2="518" y2="155" stroke="#444" stroke-width="1.8" marker-end="url(#arr2)"/>
    <!-- Supabase → App Web (right) -->
    <line x1="510" y1="175" x2="562" y2="175" stroke="#444" stroke-width="1.8" marker-end="url(#arr2)"/>
    <!-- label -->
    <rect x="507" y="145" width="65" height="42" fill="white" stroke="none"/>
    <text x="540" y="161" font-family="Times New Roman" font-size="9" fill="#333" text-anchor="middle">SDK</text>
    <text x="540" y="173" font-family="Times New Roman" font-size="9" fill="#333" text-anchor="middle">Supabase</text>

    <!-- Nota -->
    <text x="10" y="320" font-family="Times New Roman" font-size="11" font-style="italic" fill="#333">
      <tspan font-weight="bold">Nota.</tspan>
      <tspan> Representación de los módulos principales del sistema Le Chambea. Fuente propia, elaborado en Lucidchart.</tspan>
    </text>
  </svg>
</div>

</body>
</html>
