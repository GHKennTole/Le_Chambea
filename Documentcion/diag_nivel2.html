<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: white; font-family: 'Times New Roman', serif; }
</style>
</head>
<body>

<!-- ============================================================
     DIAGRAMA NIVEL 2 – Flujo de datos unidireccional
     ============================================================ -->
<div id="diag2" style="padding:28px; width:960px;">
  <div style="font-size:13px; font-weight:bold; font-style:italic; margin-bottom:4px;">Figura 23</div>
  <div style="font-size:11px; font-style:italic; margin-bottom:20px;">Diagrama nivel 2</div>

  <svg width="900" height="430" style="display:block;">
    <defs>
      <marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
        <path d="M0,1 L7,4 L0,7 Z" fill="#2c4070"/>
      </marker>
      <marker id="ar-gray" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
        <path d="M0,1 L7,4 L0,7 Z" fill="#888"/>
      </marker>
      <marker id="ar-up" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
        <path d="M0,1 L7,4 L0,7 Z" fill="#2c8060"/>
      </marker>
    </defs>
    <style>
      .box  { fill:#f0f0f0; stroke:#444; stroke-width:1.4; }
      .box-b{ fill:#e8edf5; stroke:#2c4070; stroke-width:1.8; }
      .box-g{ fill:#e8f5ee; stroke:#2c8060; stroke-width:1.8; }
      .lbl  { font-family:'Times New Roman',serif; font-size:10.5px; fill:#111; text-anchor:middle; dominant-baseline:middle; }
      .lbl-b{ font-family:'Times New Roman',serif; font-size:10px; fill:#2c4070; text-anchor:middle; dominant-baseline:middle; font-weight:bold; }
      .lbl-g{ font-family:'Times New Roman',serif; font-size:10px; fill:#1a6040; text-anchor:middle; dominant-baseline:middle; }
      .lbl-sm{ font-family:'Times New Roman',serif; font-size:9.5px; fill:#555; text-anchor:middle; }
      .arr  { stroke:#2c4070; stroke-width:1.8; fill:none; marker-end:url(#ar); }
      .arr-g{ stroke:#2c8060; stroke-width:1.8; fill:none; marker-end:url(#ar-up); }
      .arr-gray{ stroke:#888; stroke-width:1.3; fill:none; stroke-dasharray:5,3; marker-end:url(#ar-gray); }
      .step-lbl { font-family:'Times New Roman',serif; font-size:9px; fill:#666; text-anchor:middle; }
    </style>

    <!-- ════════════════════════════════════════════════════
         TITLE LABELS
         ════════════════════════════════════════════════════ -->
    <text x="450" y="22" font-family="Times New Roman" font-size="12" font-weight="bold" fill="#2c4070" text-anchor="middle">
      Flujo de datos unidireccional — Le Chambea
    </text>

    <!-- ════════════════════════════════════════════════════
         ROW 1 – MAIN FLOW (left → right)
         ════════════════════════════════════════════════════ -->
    <!-- Numbers above boxes -->
    <text x="58"  y="52" class="step-lbl">① Acción</text>
    <text x="178" y="52" class="step-lbl">② Componente</text>
    <text x="308" y="52" class="step-lbl">③ SDK</text>
    <text x="450" y="52" class="step-lbl">④ Backend</text>
    <text x="592" y="52" class="step-lbl">⑤ Respuesta</text>
    <text x="718" y="52" class="step-lbl">⑥ Estado</text>
    <text x="845" y="52" class="step-lbl">⑦ Re-render</text>

    <!-- Box 1: Usuario -->
    <rect x="10"  y="60" width="96" height="56" class="box" rx="3"/>
    <text x="58"  y="82" class="lbl" font-weight="bold">Usuario</text>
    <text x="58"  y="100" class="lbl-sm">(Interacción</text>
    <text x="58"  y="112" class="lbl-sm">en pantalla)</text>

    <!-- → -->
    <line x1="106" y1="88" x2="126" y2="88" class="arr"/>

    <!-- Box 2: React Native Component -->
    <rect x="126" y="60" width="104" height="56" class="box-b" rx="3"/>
    <text x="178" y="78" class="lbl" font-weight="bold">React Native</text>
    <text x="178" y="95" class="lbl" font-weight="bold">Component</text>
    <text x="178" y="112" class="lbl-sm">(Screen / View)</text>

    <!-- → -->
    <line x1="230" y1="88" x2="254" y2="88" class="arr"/>

    <!-- Box 3: Supabase SDK -->
    <rect x="254" y="60" width="108" height="56" class="box-b" rx="3"/>
    <text x="308" y="78" class="lbl" font-weight="bold">Supabase</text>
    <text x="308" y="95" class="lbl" font-weight="bold">SDK</text>
    <text x="308" y="112" class="lbl-sm">@supabase/js</text>

    <!-- → -->
    <line x1="362" y1="88" x2="388" y2="88" class="arr"/>

    <!-- Box 4: Supabase Backend -->
    <rect x="388" y="50" width="124" height="76" rx="3" fill="#dde5f4" stroke="#2c4070" stroke-width="2"/>
    <text x="450" y="72" class="lbl" font-weight="bold">Supabase</text>
    <text x="450" y="89" class="lbl-b">PostgreSQL</text>
    <text x="450" y="104" class="lbl-b">Auth · Storage</text>
    <text x="450" y="118" class="lbl-b">Realtime</text>

    <!-- → -->
    <line x1="512" y1="88" x2="540" y2="88" class="arr"/>

    <!-- Box 5: Respuesta -->
    <rect x="540" y="60" width="104" height="56" class="box" rx="3"/>
    <text x="592" y="78" class="lbl" font-weight="bold">Respuesta</text>
    <text x="592" y="95" class="lbl-sm">JSON / Error</text>
    <text x="592" y="110" class="lbl-sm">Handler</text>

    <!-- → -->
    <line x1="644" y1="88" x2="666" y2="88" class="arr"/>

    <!-- Box 6: Estado -->
    <rect x="666" y="60" width="104" height="56" class="box-b" rx="3"/>
    <text x="718" y="78" class="lbl" font-weight="bold">Estado</text>
    <text x="718" y="95" class="lbl-sm">Context API</text>
    <text x="718" y="110" class="lbl-sm">useState / Hook</text>

    <!-- → -->
    <line x1="770" y1="88" x2="790" y2="88" class="arr"/>

    <!-- Box 7: Re-render UI -->
    <rect x="790" y="60" width="100" height="56" class="box-b" rx="3"/>
    <text x="840" y="78" class="lbl" font-weight="bold">Re-render</text>
    <text x="840" y="95" class="lbl" font-weight="bold">UI</text>
    <text x="840" y="110" class="lbl-sm">Vista actualizada</text>

    <!-- ════════════════════════════════════════════════════
         SECTION DIVIDER
         ════════════════════════════════════════════════════ -->
    <line x1="10" y1="148" x2="890" y2="148" stroke="#ccc" stroke-width="1" stroke-dasharray="6,4"/>
    <text x="450" y="166" font-family="Times New Roman" font-size="11" font-style="italic" fill="#2c8060" text-anchor="middle" font-weight="bold">
      Canal en Tiempo Real — Chat (Supabase Realtime / WebSocket)
    </text>

    <!-- ════════════════════════════════════════════════════
         ROW 2 – REALTIME FLOW
         ════════════════════════════════════════════════════ -->
    <!-- Box: Supabase Realtime -->
    <rect x="338" y="186" width="224" height="70" rx="3" fill="#d6eedf" stroke="#2c8060" stroke-width="2"/>
    <text x="450" y="207" class="lbl" font-weight="bold" fill="#1a6040">Supabase Realtime</text>
    <text x="450" y="225" class="lbl-g">WebSocket persistente</text>
    <text x="450" y="243" class="lbl-g">Escucha cambios en DB</text>

    <!-- Supabase Backend → Realtime (down) -->
    <line x1="450" y1="126" x2="450" y2="180" class="arr-g"/>

    <!-- Box: ChatScreen Component -->
    <rect x="80"  y="194" width="180" height="54" rx="3" class="box-g"/>
    <text x="170" y="215" class="lbl" font-weight="bold">ChatScreen</text>
    <text x="170" y="232" class="lbl-sm">Component</text>
    <text x="170" y="247" class="lbl-sm">Re-render automático</text>

    <!-- Realtime → ChatScreen (left) -->
    <line x1="338" y1="221" x2="268" y2="221" class="arr-g"/>

    <!-- Box: Estado Tiempo Real -->
    <rect x="620" y="194" width="180" height="54" rx="3" class="box-g"/>
    <text x="710" y="215" class="lbl" font-weight="bold">Estado (Chat)</text>
    <text x="710" y="232" class="lbl-sm">useState / Context</text>
    <text x="710" y="247" class="lbl-sm">mensajes en tiempo real</text>

    <!-- Realtime → Estado (right) -->
    <line x1="562" y1="221" x2="614" y2="221" class="arr-g"/>

    <!-- Estado → ChatScreen (connection) -->
    <line x1="620" y1="240" x2="560" y2="270" stroke="#2c8060" stroke-width="1.3" fill="none" stroke-dasharray="4,3"/>
    <line x1="260" y1="248" x2="260" y2="270" stroke="#2c8060" stroke-width="1.3" fill="none" stroke-dasharray="4,3"/>
    <line x1="260" y1="270" x2="560" y2="270" stroke="#2c8060" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#ar-up)"/>

    <!-- ════════════════════════════════════════════════════
         LEGEND / KEYS
         ════════════════════════════════════════════════════ -->
    <rect x="10" y="300" width="880" height="100" rx="3" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
    <text x="26" y="322" font-family="Times New Roman" font-size="11" font-weight="bold" fill="#333">Descripción del flujo:</text>

    <text x="26" y="343" font-family="Times New Roman" font-size="10.5" fill="#333">
      ① El usuario realiza una acción en la pantalla (clic, scroll, envío de formulario).
    </text>
    <text x="26" y="360" font-family="Times New Roman" font-size="10.5" fill="#333">
      ② El componente de React Native captura el evento y llama al servicio correspondiente.
    </text>
    <text x="26" y="377" font-family="Times New Roman" font-size="10.5" fill="#333">
      ③ El SDK de Supabase procesa la solicitud (lectura / escritura en PostgreSQL, auth, storage).
    </text>
    <text x="26" y="394" font-family="Times New Roman" font-size="10.5" fill="#333">
      ④ Supabase devuelve la respuesta → ⑤ actualiza el estado local → ⑥ re-renderiza la UI automáticamente.
    </text>

    <!-- ─── Nota ─── -->
    <text x="10" y="416" font-family="Times New Roman" font-size="11" font-style="italic" fill="#333">
      <tspan font-weight="bold">Nota.</tspan>
      <tspan> Flujo de datos unidireccional y canal en tiempo real. Fuente propia elaborado en Lucidchart.</tspan>
    </text>
  </svg>
</div>

</body>
</html>
